name: Chalk

options:
  bundleIdPrefix: com.huleux
  createIntermediateGroups: true

packages:
  ChalkKit:
    path: ChalkKit

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # --- build stamps ---------------------------------------------------
    # Defaults to empty and is overridden on the xcodebuild command line by
    # scripts/release-mac.sh. Declaring it here rather than leaving it
    # undefined is what stops $(CHALK_GIT_COMMIT) reaching the generated
    # Info.plist as its own literal.
    #
    # The commit a tester's screenshot came from, shown in About. Without it,
    # "which build is this?" costs a round trip to someone who has already
    # moved on.
    CHALK_GIT_COMMIT: ""

targets:
  Chalk:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Chalk
        excludes:
          - "Resources/editor"
      # The built web editor ships as a folder reference (preserves the
      # editor.html / bundle.js sibling layout that loadFileURL needs). It is a
      # gitignored build artifact produced by web/build.mjs (`pnpm web:build`),
      # which the pre-build phase below regenerates. `optional` lets xcodegen
      # run on a fresh clone before the first web build.
      - path: Chalk/Resources/editor
        type: folder
        buildPhase: resources
        optional: true
      # MIT/OFL attribution for everything bundled (generated by
      # scripts/generate-third-party-notices.mjs); rendered by the
      # Settings → Acknowledgements screen.
      - path: ../THIRD-PARTY-NOTICES
        buildPhase: resources
    dependencies:
      - package: ChalkKit
        product: ChalkKit
    scheme:
      testTargets:
        - ChalkTests
    info:
      path: Chalk/Info.plist
      properties:
        CFBundleDisplayName: Chalk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CHALKGitCommit: $(CHALK_GIT_COMMIT)
        LSApplicationCategoryType: public.app-category.productivity
        # Only HTTPS/system crypto: exempt, and answering here skips the
        # per-build export-compliance prompt in App Store Connect.
        ITSAppUsesNonExemptEncryption: false
        NSPrincipalClass: NSApplication
        # The editor face (design spec --font-editor), bundled from
        # Resources/fonts; XcodeGen flattens them into the bundle's Resources root.
        ATSApplicationFontsPath: "."
        # Let Finder hand .tex/.md/.qmd files to Chalk. Without
        # these declarations LaunchServices won't route a double-clicked file to
        # us even if the user picks Chalk in "Open With". The exported UTIs below
        # own the extensions (all plain-text); the doc types claim them as an
        # editor. AppDelegate consumes the resulting application(_:open:).
        CFBundleDocumentTypes: &chalkDocumentTypes
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
              - com.huleux.chalk.markdown
          - CFBundleTypeName: TeX Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.huleux.chalk.tex
          - CFBundleTypeName: Quarto Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.huleux.chalk.quarto
          # Folders (Finder/Raycast "Open With", `open -a Chalk <dir>`): opened as
          # a window rooted at that folder. Viewer + Alternate: never the default.
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.folder
        # Chalk defines the com.huleux.chalk.* identifiers, so they are
        # *exported* type declarations (imported is for describing UTIs some
        # other app owns; LaunchServices and App Review both care).
        UTExportedTypeDeclarations: &chalkExportedTypes
          - UTTypeIdentifier: com.huleux.chalk.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
                - mdown
          - UTTypeIdentifier: com.huleux.chalk.tex
            UTTypeDescription: TeX Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - tex
          - UTTypeIdentifier: com.huleux.chalk.quarto
            UTTypeDescription: Quarto Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - qmd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huleux.chalk
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # App Sandbox.
        CODE_SIGN_ENTITLEMENTS: Chalk/Chalk-mac.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: false # the pre-build phase runs node over web/ and node_modules/
      configs:
        # Debug builds, and so the ChalkTests host, get their own preferences
        # domain: tests write UserDefaults.standard, and with the Release ID they
        # would rewrite the installed app's settings and Library bookmarks.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.huleux.chalk.debug
    preBuildScripts:
      - name: Build web editor bundle
        # Keeps the in-app editor current. Cheap when nothing changed:
        # build.mjs bundles in memory and rewrites only files whose bytes
        # differ, so Resources/editor keeps its mtimes and Xcode recopies
        # nothing.
        # Needs node plus the workspace's node_modules (`pnpm install` at the
        # repo root); pnpm itself is not needed here.
        # Release archives must be hermetic: a missing node or node_modules
        # silently shipping a stale (or empty) editor bundle is a store-build
        # hazard, so Release fails hard where Debug only warns.
        script: |
          # Release ships minified. Debug does not: readable frames in a stack
          # trace are worth more during development than 2 MB of bundle.
          if [ "$CONFIGURATION" = "Release" ]; then export MINIFY=1; fi
          # Xcode runs build phases with a minimal PATH that omits Homebrew.
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          WEB="$SRCROOT/../web"
          skip() {
            if [ "$CONFIGURATION" = "Release" ]; then
              echo "error: $1; refusing to archive with a stale Resources/editor"
              exit 1
            fi
            echo "warning: $1; using previously built Resources/editor"
          }
          if ! command -v node >/dev/null 2>&1; then
            skip "node not found"
          elif [ ! -e "$WEB/node_modules/@chalk/editor-core" ]; then
            skip "web dependencies missing (run pnpm install at the repo root)"
          else
            node "$WEB/build.mjs" || exit 1
          fi
          if [ ! -f "$SRCROOT/Chalk/Resources/editor/editor.html" ]; then
            echo "error: Resources/editor is missing editor.html; web bundle was not built"
            exit 1
          fi
        basedOnDependencyAnalysis: false

  # Host-based unit tests for app-target logic that can't live in pure-Foundation
  # ChalkKit (the shell imports AppKit). Injects fakes via the EditorSurface
  # protocol, so no UI automation is needed.
  ChalkTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - ChalkTests
    dependencies:
      - target: Chalk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huleux.chalk.unittests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Chalk.app/Contents/MacOS/Chalk"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: true
