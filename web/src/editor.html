<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!--
      Local trusted bundle loaded via loadFileURL. Scripts only from the bundle;
      CodeMirror injects <style> at runtime (style-src 'unsafe-inline'); images
      and fonts are data: (inlined) or file: (host-resolved assets). No network.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: file:; font-src data:; connect-src 'none';"
    />
    <link rel="stylesheet" href="bundle.css" />
  </head>
  <body>
    <!-- `editor-host` scopes chalk-theme.css's writing-surface rules (centered
         measure, 2.5px bar caret with a soft fade). -->
    <div id="root" class="editor-host"></div>
    <script src="bundle.js"></script>
  </body>
</html>
